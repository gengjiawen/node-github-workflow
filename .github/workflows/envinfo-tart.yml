name: Envinfo Tart Pull

on: [push, pull_request]

jobs:
  envinfo-tart-pull:
    # Tart VM images only work on Apple Silicon macOS hosts.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Environment Information
        run: npx envinfo
      - name: Install Tart
        run: brew install cirruslabs/cli/tart
      - name: Pull macOS Tahoe Xcode image
        run: tart pull ghcr.io/cirruslabs/macos-tahoe-xcode:26.5
