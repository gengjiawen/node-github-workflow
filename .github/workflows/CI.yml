name: CI
# Interactive Android 15 (Redroid, native arm64) on ubuntu-26.04-arm for testing an
# Android app by hand over upterm. The APK and any credentials travel over the upterm
# session (ssh/sftp), never through this repo or the job log.
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  redroid:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - name: Start Redroid 15 (720x1600, 280 dpi)
        run: |
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo apt-get update -qq && sudo apt-get install -y -qq adb >/dev/null
          # memfd: kernel 7.0 has no ashmem. Redroid 16 crash-loops on this runner.
          docker run -d --privileged --name redroid -p 5555:5555 redroid/redroid:15.0.0-latest \
            androidboot.use_memfd=true androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=720 androidboot.redroid_height=1600 androidboot.redroid_dpi=280 >/dev/null
          A="adb -s localhost:5555"
          for i in $(seq 1 60); do
            adb connect localhost:5555 >/dev/null 2>&1
            if [ "$($A shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              echo "booted after $((i * 5))s"; break
            fi
            sleep 5
          done
          $A shell getprop | grep -E 'ro\.build\.version\.(release|sdk)\]|ro\.product\.cpu\.abilist\]'
          $A shell wm size
          $A shell wm density
      - name: Setup upterm session
        id: upterm
        uses: owenthereal/action-upterm@v2
        with:
          detached: true
          limit-access-to-actor: true
          wait-timeout-minutes: 30
      - name: Publish the join command
        env:
          SSH_COMMAND: ${{ steps.upterm.outputs.ssh-command }}
        run: echo "$SSH_COMMAND" > ssh-command.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-command
          path: ssh-command.txt
          retention-days: 1
