name: CI
# Probe Android options on the GitHub-hosted Linux arm64 runner (ubuntu-26.04-arm).
# Run 1 (9e81749): no /dev/kvm, no linux-aarch64 emulator build, sdkmanager 23's `android`
# binary is x86-64 only; Redroid 16 started but sys.boot_completed stayed unset for 3 min.
# Run 2 (85eaab4): memfd + guest GPU; hello32/hello64 run natively, but zygote and the
# services it restarts loop, so boot never completes and PackageManager is never ready.
# Run 3: Redroid 14/15/16 in parallel, crash buffer dumped when boot does not complete.
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-probes:
    runs-on: ubuntu-24.04
    steps:
      - name: Build static hello binaries and ABI-only APKs
        run: |
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          TC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          mkdir -p out && cd out
          echo '#include <stdio.h>' > hello.c
          echo 'int main(void) { printf("%zu-bit code runs\n", sizeof(void *) * 8); return 0; }' >> hello.c
          "$TC/armv7a-linux-androideabi24-clang" -static -O2 -o hello32 hello.c
          "$TC/aarch64-linux-android24-clang" -static -O2 -o hello64 hello.c
          file hello32 hello64
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PJ=$(ls -d "$ANDROID_HOME"/platforms/android-[0-9]* | sort -V | tail -1)/android.jar
          keytool -genkeypair -keystore k.jks -storepass android -keypass android -alias a \
            -keyalg RSA -keysize 2048 -validity 1000 -dname CN=probe 2>/dev/null
          for abi in armeabi-v7a arm64-v8a x86_64; do
            w=work-$abi
            mkdir -p "$w/lib/$abi"
            printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="%s">\n<uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34"/>\n<application android:hasCode="false" android:extractNativeLibs="true"/>\n</manifest>\n' \
              "probe.abi.$(echo "$abi" | tr -d '_-')" > "$w/AndroidManifest.xml"
            "$BT/aapt2" link -o "$w/base.apk" -I "$PJ" --manifest "$w/AndroidManifest.xml"
            printf 'placeholder\n' > "$w/lib/$abi/libprobe.so"
            (cd "$w" && zip -q base.apk "lib/$abi/libprobe.so")
            "$BT/zipalign" -f 4 "$w/base.apk" "$w/aligned.apk"
            "$BT/apksigner" sign --ks k.jks --ks-pass pass:android --out "only-$abi.apk" "$w/aligned.apk"
          done
          rm -rf work-* k.jks hello.c
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: probes
          path: out/
          retention-days: 1

  probe:
    needs: build-probes
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        redroid: ["14.0.0-latest", "15.0.0-latest", "16.0.0-latest"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: probes
          path: probes

      - name: Redroid ${{ matrix.redroid }} with memfd and guest GPU
        run: |
          set +e
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" && echo "binder_linux loaded"
          sudo apt-get update -qq && sudo apt-get install -y -qq adb >/dev/null
          docker run -d --privileged --name redroid -p 5555:5555 "redroid/redroid:${{ matrix.redroid }}" \
            androidboot.use_memfd=true androidboot.redroid_gpu_mode=guest >/dev/null
          A="adb -s localhost:5555"
          booted=
          for i in $(seq 1 72); do
            adb connect localhost:5555 >/dev/null 2>&1
            if [ "$($A shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              booted=$((i * 5)); break
            fi
            sleep 5
          done
          echo "sys.boot_completed=1 after: ${booted:-NOT within 360}s"
          $A shell getprop | grep -E 'ro\.build\.version\.(release|sdk)\]|ro\.product\.cpu\.abilist|native\.bridge'
          echo "--- run static binaries"
          for b in hello32 hello64; do
            $A push "probes/$b" "/data/local/tmp/$b" >/dev/null
            $A shell chmod 755 "/data/local/tmp/$b"
            echo "$b: $($A shell "/data/local/tmp/$b" 2>&1)"
          done
          if [ -n "$booted" ]; then
            echo "--- adb install ABI-only APKs"
            for apk in probes/only-*.apk; do
              echo "$(basename "$apk"): $(timeout 60 $A install "$apk" 2>&1 | tail -1)"
            done
          else
            echo "--- services stuck restarting"
            $A shell getprop | grep -E 'init\.svc\.' | grep restarting
            echo "--- crash buffer"
            $A logcat -d -b crash 2>/dev/null | grep -E 'FATAL|Abort message|signal [0-9]+|Cmdline|pid: |#0[0-4] |Exception|Caused by|at com\.android\.server' | head -60
          fi
