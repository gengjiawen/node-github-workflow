name: Envinfo Tart Pull

on: [push, pull_request]

jobs:
  envinfo-tart-pull:
    # Tart VM images only work on Apple Silicon macOS hosts.
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Environment Information
        run: npx envinfo

      - name: Free disk space
        run: |
          set -euxo pipefail
          df -h /
          # Remove unused Xcode apps to make room for the ~50GB+ Tart image.
          for app in /Applications/Xcode*.app; do
            [ -e "$app" ] || continue
            echo "Removing $app"
            sudo rm -rf "$app"
          done
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          sudo rm -rf /Users/runner/Library/Android || true
          brew cleanup -s || true
          df -h /

      - name: Install Tart
        run: |
          set -euxo pipefail
          brew trust cirruslabs/cli || true
          brew install cirruslabs/cli/tart
          tart --version

      - name: Pull macOS Tahoe Xcode image
        run: |
          set -euxo pipefail
          df -h /
          tart pull ghcr.io/cirruslabs/macos-tahoe-xcode:26.5
          tart list
          df -h /
